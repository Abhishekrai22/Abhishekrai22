<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <style>
      body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,sans-serif;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f172a;color:#e2e8f0}
      .card{background:#111827;padding:2rem 2.5rem;border-radius:12px;max-width:560px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
      h1{margin:0 0 8px;font-size:28px}
      p{margin:0 0 16px;line-height:1.5}
      a{color:#93c5fd;text-decoration:none}
      .actions{margin-top:18px}
      .btn{display:inline-block;padding:.6rem 1rem;background:#2563eb;border-radius:8px;color:#fff}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>We hit a snag</h1>
      <p>Our server encountered an unexpected error. Please try again. If the problem persists, contact support.</p>
      <div class="actions">
        <a class="btn" href="/service-module">Back to dashboard</a>
      </div>
    </div>
  </body>
</html>
